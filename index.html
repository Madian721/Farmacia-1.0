<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Farmacia Salud</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Farmacia Salud</h1>

<nav>

<div class="menu">
<img src="img/inicio.png">

</div>

<div class="menu">
<img src="img/productos.png">
<p>Productos</p>
</div>

<div class="menu">
<img src="img/ofertas.png">
<p>Ofertas</p>
</div>

<div class="menu">
<img src="img/telefono.png">
<p>Contacto</p>
</div>

<div class="menu">
<img src="img/ubicacion.png">
<p>Ubicación</p>
</div>

</nav>

<section class="banner">

<p>Medicamentos y productos para tu bienestar</p>

<div class="producto">

<p>$60</p>
<button onclick="comprar('Ibuprofeno')">Comprar</button>
</div>

<div class="producto">
<img src="img/Pastillas3.jpg">
<h3>Vitaminas</h3>
<p>$80</p>
<button onclick="comprar('Vitaminas')">Comprar</button>
</div>

<div class="producto">
<img src="img/jarabe.png">
<h3>Jarabe</h3>
<p>$45</p>
<button onclick="comprar('Jarabe')">Comprar</button>
</div>

</div>

</section>

<section class="info">

<h2>Nuestro Equipo</h2>

<div class="equipo">

<img src="img/doctor.jpg">
<img src="img/doctora.jpg">
<img src="img/Quimico.jpg">

<footer>

<p>Farmacia Salud © 2025</p>

</footer>
